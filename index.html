<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Priority ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      font-family: 'Poppins', sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 2em;
      color: #444;
      margin-bottom: 20px;
    }

    .question {
      margin: 20px 0;
      font-size: 1.2em;
    }

    button {
      margin: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      background: #ff6f61;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: 0.3s;
      position: relative;
    }

    button:hover {
      background: #e91e63;
      transform: scale(1.05);
    }

    /* Main Page */
    #mainPage {
      display: none;
      height: 100vh;
      width: 100%;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      overflow: hidden;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    @keyframes gradient {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    #mainPage h2 {
      color: #fff;
      font-size: 2em;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    }

    #typewriter {
      margin-top: 15px;
      font-size: 1.2em;
      color: #fff;
      min-height: 40px;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      color: rgba(255,255,255,0.8);
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {transform: translateY(100vh) scale(0.5);}
      100% {transform: translateY(-10vh) scale(1);}
    }
  </style>
</head>
<body>
  <!-- Fun Quiz Page -->
  <div id="quizPage">
    <h1>Answer Honestly 😏</h1>

    <div class="question">Q1: Who is your favorite person? 🥰</div>
    <button onclick="goToMain()">Me 😉</button>
    <button class="tricky">Not You 😜</button>

    <div class="question">Q2: Who is always your priority? 🌟</div>
    <button onclick="goToMain()">You ❤️</button>
    <button class="tricky">Maybe Someone Else 🤔</button>

    <div class="question">Q3: Who makes you smile the most? 😍</div>
    <button onclick="goToMain()">Obviously You 💕</button>
    <button class="tricky">Not Sure 😅</button>
  </div>

  <!-- Main Love Page -->
  <div id="mainPage">
    <h2>💖 You are My Priority 💖</h2>
    <div id="typewriter"></div>
  </div>

  <script>
    // Switch to main page
    function goToMain() {
      document.getElementById("quizPage").style.display = "none";
      document.getElementById("mainPage").style.display = "flex";
      typeWriter();
      setInterval(createHeart, 500);
    }

    // Typewriter effect
    const messages = [
      "I care about you deeply ❤️",
      "You mean everything to me 💕",
      "You are always my priority 🌟"
    ];
    let i = 0, j = 0, currentMessage = "";
    function typeWriter() {
      if (i < messages.length) {
        if (j < messages[i].length) {
          currentMessage += messages[i].charAt(j);
          document.getElementById("typewriter").innerHTML = currentMessage;
          j++;
          setTimeout(typeWriter, 80);
        } else {
          setTimeout(() => {
            i++;
            j = 0;
            currentMessage = "";
            setTimeout(typeWriter, 800);
          }, 1200);
        }
      } else {
        i = 0;
        setTimeout(typeWriter, 1000);
      }
    }

    // Floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 20 + 15 + "px";
      heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
      document.body.appendChild(heart);
      setTimeout(() => { heart.remove(); }, 6000);
    }

    // Make tricky buttons run away (desktop + mobile)
    const trickyButtons = document.querySelectorAll(".tricky");

    function moveButton(btn) {
      const x = Math.random() * (window.innerWidth - btn.offsetWidth);
      const y = Math.random() * (window.innerHeight - btn.offsetHeight);
      btn.style.position = "absolute";
      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
    }

    trickyButtons.forEach(btn => {
      // Desktop hover
      btn.addEventListener("mouseover", () => moveButton(btn));
      // Mobile touch
      btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        moveButton(btn);
      });
    });
  </script>
</body>
</html>

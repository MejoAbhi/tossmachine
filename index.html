<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    overflow:hidden;
}

#landing{
    text-align:center;
}

button{
    padding:18px 40px;
    font-size:22px;
    border:none;
    border-radius:12px;
    background:#ff5722;
    color:#fff;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

#message{
    display:none;
    color:#fff;
    text-align:center;
}

h1{
    font-size:2rem;
    margin-bottom:20px;
}

.firework{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    animation:explode 1.2s ease-out forwards;
}

@keyframes explode{
    0%{
        transform:translate(0,0) scale(0);
        opacity:1;
    }
    100%{
        transform:translate(var(--x),var(--y)) scale(1.5);
        opacity:0;
    }
}
</style>
</head>

<body>

<div id="landing">
    <button onclick="showSurprise()">Click Here 🎉</button>
</div>

<div id="message">
    <h1>🎉 Surprise! 🎆</h1>
    <h2>Have a wonderful day!</h2>
</div>

<script>
function showSurprise(){

    document.getElementById("landing").style.display="none";
    document.getElementById("message").style.display="block";

    for(let i=0;i<300;i++){

        let p=document.createElement("div");
        p.className="firework";

        p.style.left=Math.random()*window.innerWidth+"px";
        p.style.top=Math.random()*window.innerHeight+"px";

        p.style.background=`hsl(${Math.random()*360},100%,60%)`;

        p.style.setProperty("--x",(Math.random()*300-150)+"px");
        p.style.setProperty("--y",(Math.random()*300-150)+"px");

        document.body.appendChild(p);

        setTimeout(()=>p.remove(),1200);
    }
}
</script>

</body>
</html>

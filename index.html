<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Button</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#6a11cb,#2575fc);
        padding:20px;
    }

    .container{
        width:100%;
        max-width:500px;
        background:#fff;
        border-radius:20px;
        padding:30px 20px;
        text-align:center;
        box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    h2{
        margin-bottom:20px;
        color:#333;
        font-size:1.6rem;
    }

    button{
        width:100%;
        padding:15px;
        font-size:1.1rem;
        border:none;
        border-radius:12px;
        background:#007BFF;
        color:white;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#0056b3;
        transform:scale(1.02);
    }

    #message{
        display:none;
        margin-top:25px;
        font-size:1.2rem;
        font-weight:bold;
        color:#d63384;
        line-height:1.6;
        animation:fadeIn 0.8s ease;
        word-wrap:break-word;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(20px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    /* Mobile */
    @media (max-width:600px){
        .container{
            padding:25px 15px;
        }

        h2{
            font-size:1.3rem;
        }

        button{
            font-size:1rem;
            padding:14px;
        }

        #message{
            font-size:1rem;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h2>Click the Button</h2>

    <button onclick="showMessage()">
        Click Here
    </button>

    <div id="message">
        Sangita akta hawasi meye.<br>
        Or matha dekhano dorkar.
    </div>
</div>

<script>
function showMessage() {
    document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
